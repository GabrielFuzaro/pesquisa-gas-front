<form [formGroup]="estabelecimentoFormulario" class="w-full">
  <div class="relative w-full">

    <label class="block text-sm mb-1" for="nome">
      Estabelecimentos
    </label>

    <input
      id="nome"
      type="text"
      formControlName="nome"
      autocomplete="off"
      placeholder="Pesquisar estabelecimento..."
      class="w-full p-2.5 border rounded-md"
      (input)="filtrarEstabelecimentos()"
    >

    <div
      *ngIf="estabelecimentosFiltrados.length > 0"
      class="absolute z-10 w-full bg-white border border-gray-200 rounded-md shadow-md mt-1 max-h-52 overflow-y-auto"
    >

      <button
        type="button"
        *ngFor="let estabelecimento of estabelecimentosFiltrados"
        class="w-full text-left px-4 py-2 hover:bg-gray-100"
        (click)="selecionarEstabelecimento(estabelecimento)"
      >
        {{ estabelecimento.nome }}
      </button>

    </div>

  </div>
</form>
