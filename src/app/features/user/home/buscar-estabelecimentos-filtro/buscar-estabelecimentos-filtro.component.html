<form [formGroup]="estabelecimentoFormulario" class="w-full">
  <div class="relative w-full">

    <label class="block text-sm font-medium mb-1.5" for="nome">
      Estabelecimentos
    </label>

    <div class="relative w-full">
      <input
        id="nome"
        type="text"
        formControlName="nome"
        autocomplete="off"
        placeholder="Pesquisar estabelecimento..."
        class="w-full p-3 pr-10 text-sm border rounded-md"
        (input)="filtrarEstabelecimentos()"
        (focus)="mostrarDropdown = true"
        (blur)="onBlurInput()"
      >

      <button
        *ngIf="estabelecimentoFormulario.get('nome')?.value"
        type="button"
        (mousedown)="limparFiltroEstabelecimento()"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div
      *ngIf="mostrarDropdown && estabelecimentosFiltrados.length > 0"
      class="absolute z-10 w-full bg-white border border-gray-200 rounded-md shadow-md mt-1 max-h-56 overflow-y-auto"
    >

      <button
        type="button"
        *ngFor="let estabelecimento of estabelecimentosFiltrados"
        class="w-full text-left px-4 py-2.5 text-sm hover:bg-gray-100"
        (click)="selecionarEstabelecimento(estabelecimento)"
      >
        {{ estabelecimento.nome }}
      </button>

    </div>

  </div>
</form>
