<div *ngIf="competenciaFormulario" class="w-full">
    <div class="col w-full">
        <div class="flex gap-5">
            <div *ngFor="let competencia of competencias">
                <button
                    type="button"
                    (click)="selecionarCompetencia(competencia)"
                    [class.font-bold]="competenciaSelecionada?.mes === competencia.mes && competenciaSelecionada?.ano === competencia.ano"
                >
                    <div class="flex justify-between">
                        {{ competencia.mesExtenso }}
                        {{ competencia.ano }}
                    </div>
                </button>
            </div>
        </div>
    </div>
</div>

<div *ngIf="mostrarTabela" class="w-full mt-5 rounded-lg border border-gray-200 overflow-hidden">
    <table class="w-full table-fixed border-collapse">
        <thead>
            <tr class="bg-gray-50">
                <th class="w-1/2 py-4 px-6 text-left text-xs font-bold uppercase tracking-wide text-gray-500">
                    Posto
                </th>
                <th class="w-1/6 py-4 px-6 text-left text-xs font-bold uppercase tracking-wide text-gray-500">
                    Preço
                </th>
                <th class="w-1/6 py-4 px-6 text-left text-xs font-bold uppercase tracking-wide text-gray-500">
                    Data
                </th>
            </tr>
        </thead>

        <tbody>
            <ng-container *ngFor="let historico of historicos">
                <tr
                    *ngFor="let info of historico.informacoes"
                    class="border-t border-gray-100 hover:bg-gray-50"
                >
                    <td class="py-4 px-6 text-left">
                        <div class="flex items-center gap-1.5">
                            <span class="text-base font-bold text-[#14263d] truncate">
                                {{ historico.estabelecimento }}
                            </span>
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="h-3.5 w-3.5 shrink-0 text-[#14263d]"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                            </svg>
                        </div>
                    </td>
                    <td class="py-4 px-6 text-left">
                        <span class="inline-block rounded-md bg-gray-100 px-2.5 py-1 text-sm font-semibold text-[#14263d] whitespace-nowrap">
                            R$ {{ info.preco | number:'1.2-2' }}
                        </span>
                    </td>
                    <td class="py-4 px-6 text-left text-sm text-gray-500 whitespace-nowrap">
                        {{ info.data | date:'dd/MM/yyyy' }}
                    </td>
                </tr>
            </ng-container>
        </tbody>
    </table>
</div>
