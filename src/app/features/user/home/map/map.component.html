<div #mapContainer class="w-full h-[500px] rounded-lg"></div>

<div
  *ngIf="showModalNavegacao"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50"
  (click)="fecharModalNavegacao()"
>
  <div class="bg-white rounded-lg p-6 w-80" (click)="$event.stopPropagation()">
    <h3 class="text-lg font-bold text-[#14263d] mb-1">
      {{ coordsSelecionadas?.nome }}
    </h3>

    <div *ngIf="coordsSelecionadas?.precos?.length" class="flex flex-col gap-1 mb-4">
      <div *ngFor="let item of coordsSelecionadas?.precos" class="flex items-baseline justify-between">
        <span class="text-xs text-gray-500">{{ item.tamanhoDescricao }}</span>
        <span class="text-lg font-bold text-green-600">
          R$ {{ item.preco | number:'1.2-2' }}
        </span>
      </div>
    </div>

    <div class="flex flex-col gap-3">
      <button type="button" (click)="abrirGoogleMaps()" class="px-4 py-2 rounded-md bg-[#14263d] text-white">
        Abrir no Google Maps
      </button>

      <button type="button" (click)="abrirWaze()" class="px-4 py-2 rounded-md bg-blue-500 text-white">
        Abrir no Waze
      </button>

      <button type="button" (click)="fecharModalNavegacao()" class="px-4 py-2 rounded-md border border-gray-300 text-[#14263d]">
        Cancelar
      </button>
    </div>
  </div>
</div>
