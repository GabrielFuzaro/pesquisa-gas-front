<form
    *ngIf="competenciaFormulario"
    [formGroup]="competenciaFormulario"
    class="w-full"
>
    <div class="block md:flex md:justify-between justify-center gap-5">
        <div class="col w-full">

            <label class="block text-base font-medium mb-2" for="competencia">
                Competência
            </label>

            <select
                id="competencia"
                formControlName="competencia"
                (change)="selecionarCompetencia($any($event.target).value)"
                class="w-full p-4 text-base border rounded-md"
            >
                <option value="" disabled selected>
                    Selecione a competência
                </option>

                <option
                    *ngFor="let competencia of competencias"
                    [value]="competencia.mes + '-' + competencia.ano"
                >
                    {{ competencia.mesExtenso }}/{{ competencia.ano }}
                </option>
            </select>

        </div>
    </div>
