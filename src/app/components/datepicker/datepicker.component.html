<label for="datepicker" class="mb-1 text-gray-700 block">{{ textLabel }}</label>

<div class="relative">
  <input type="hidden" name="date" />
  <input
    type="text"
    readonly
    [(ngModel)]="datepickerValue"
    class="default-input w-full"
    (click)="showDatepicker = !showDatepicker"
  />

  <div class="absolute top-0 right-0 px-3 py-2">
    <svg
      class="h-6 w-6 text-gray-400"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
      />
    </svg>
  </div>

  <div
    *ngIf="showDatepicker"
    class="bg-white mt-5 rounded-lg shadow block"
    style="width: 17rem"
  >
    <div class="flex justify-between items-center mb-2 p-2">
      <div>
        <span class="text-lg font-bold text-gray-800">{{
          MONTH_NAMES[month]
        }}</span>
        <span class="ml-1 text-lg text-gray-600 font-normal">{{ year }}</span>
      </div>
      <div class="">
        <button
          type="button"
          class="transition ease-in-out duration-100 inline-flex cursor-pointer hover:bg-gray-200 p-2 rounded-full"
          [ngClass]="{ 'cursor-not-allowed opacity-25': month == 0 }"
          [disabled]="month == 0 ? true : false"
          (click)="month = month - 1; getNoOfDays()"
        >
          <svg
            class="h-6 w-6 text-gray-500 inline-flex"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            />
          </svg>
        </button>
        <button
          type="button"
          class="transition ease-in-out duration-100 inline-flex cursor-pointer hover:bg-gray-200 p-1 rounded-full"
          [ngClass]="{ 'cursor-not-allowed opacity-25': month == 11 }"
          [disabled]="month == 11 ? true : false"
          (click)="month = month + 1; getNoOfDays()"
        >
          <svg
            class="h-6 w-6 text-gray-500 inline-flex"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            />
          </svg>
        </button>
      </div>
    </div>

    <div class="mb-3 grid grid-cols-7">
      <div *ngFor="let day of DAYS; let i = index" class="">
        <div class="" class="">
          <div class="text-gray-800 font-medium text-center text-xs">
            {{ day }}
          </div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-7 p-2">
      <div *ngFor="let blankday of blankdays">
        <div class="text-center border p-1 border-transparent text-sm"></div>
      </div>

      <div
        *ngFor="let date of no_of_days"
        class="grid grid-cols-7 flex items-center justify-center w-full h-full"
      >
        <div class="m-2 w-full h-full flex justify-center">
          <button
            (click)="getDateValue(date)"
            class="self-center text-center text-sm leading-none rounded leading-loose transition ease-in-out duration-100"
            [ngClass]="{
              'bg-blue-500 text-white w-full h-full': isToday(date),
              'text-gray-700 hover:bg-blue-200 hover:w-full hover:h-full':
                !isToday(date)
            }"
          >
            {{ date }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
